# Standardkonfiguration. Ist im Image enthalten und wird bei jedem Update erneuert,
# deshalb hier nichts ändern. Eigene Anpassungen: in data/config.yaml nur die
# Einträge eintragen, die abweichen sollen (siehe README, "Konfiguration anpassen").

mqtt:
  host: "192.168.1.100"   # per Umgebungsvariable MQTT_HOST setzen
  port: 1883
  username: ""
  password: ""
  # '+' fängt jedes Fahrzeug-Subtopic ab, z.B. homeassistant/boswatch/alarm/1234567.
  # Schreibt dein Setup alles auf ein einziges Topic, hier die exakte Angabe eintragen.
  topic: "homeassistant/boswatch/alarm/+"

# Jeder Eintrag steht für ein Feld des MQTT-JSON und wird zu einem Telegram-Befehl.
#
#   for:      Name des JSON-Feldes. Daraus entsteht der Befehl (ric -> /ric).
#             Alles ist Freieingabe: /ric 1234567, /ric 123*, /message THL*
#   label:    Anzeigename in Meldungen (Standard: der Feldname)
#   match:    Verhalten bei Eingabe OHNE Wildcard
#               exact    -> der Wert muss genau passen
#               contains -> der Wert muss den Text enthalten (Standard)
#             Mit Wildcard (* % ? _) gilt immer das Muster. '301*' = beginnt mit 301,
#             '*301*' = enthält 301. 're:...' nimmt eine Regex.
#   command:  anderer Befehlsname statt dem Feldnamen (optional)
#
# Optional, wenn ein Feld einen lesbaren Namen ergänzt (z.B. RIC -> Beschreibung):
#   add:       Name des ergänzten JSON-Feldes. Daraus entsteht ein zweiter Befehl, der
#              nach Namen sucht (description -> /description). Ausgewählt wird der Name,
#              abonniert wird der Wert aus 'for'. Wildcards legen direkt ein Muster an.
#   add_label: Anzeigename dafür
#   csv:       CSV im BOSWatch3-Descriptor-Format (for,add,isRegex) mit Namen für die
#              Suche, nur lesend. Ohne Angabe wird data/descriptions_<for>.csv genutzt,
#              falls vorhanden. Per Umgebungsvariable: CSV_PATH_<FELD>, z.B. CSV_PATH_RIC.
#   learn:     Paare (for -> add) aus Alarmen merken und in die Suche aufnehmen
#              (Standard: true)
#
# Eigene Änderungen (data/config.yaml) werden über 'for' zugeordnet: gleiches 'for'
# ergänzt oder ändert diesen Eintrag, ein neues 'for' hängt einen Eintrag an,
# 'remove: true' entfernt einen Eintrag.
fields:
  - for: ric
    label: "RIC"
    match: exact
    add: description
    add_label: "Fahrzeug / Wache"

  - for: message
    label: "Alarmstichwort"

  - for: subricText
    label: "Sub-RIC"
    match: exact

# Aufbau der Alarm-Nachricht. Ohne eigene Vorlage gilt diese (steckt im Programm und ist
# bei jedem Update aktuell, hier nur zur Dokumentation):
#
#   notification:
#     template: |
#       🚨 <b>BOS-ALARM</b> 🚨
#
#       {DESCRIPTION_LIST|RIC_LIST}
#       {MESSAGE}
#
#       <i>abonniert über: {MATCHED}</i>
#
# Eine eigene Vorlage kommt in data/config.yaml (siehe README, "Nachricht anpassen").
# Platzhalter wie bei BOSWatch3 in Großbuchstaben, die Schreibweise des Feldes im Alarm ist egal:
#   {FELD}         Wert eines Feldes aus dem Alarm, z.B. {MESSAGE}, {RIC}, {SUBRICTEXT}
#   {FELD_LIST}    alle Werte eines Multicast-Alarms (Feld 'feld_list'), eine Zeile pro Wert;
#                  leere und doppelte entfallen, ohne Liste gilt der einzelne Wert
#   {MATCHED}      Name des passenden Abos
#   {A|B}          Rückfall: der erste Platzhalter, der nicht leer ist
#   {{ und }}      wörtliche geschweifte Klammern
# Ist in einer Zeile jeder Platzhalter leer, entfällt die Zeile. Enthält eine Zeile genau eine
# {..._LIST}, wird sie für jeden Eintrag wiederholt ("• {DESCRIPTION_LIST}"). Der Text der Vorlage
# ist Telegram-HTML (<b>, <i>, <code> ...), ein '&' darin als &amp; schreiben.
# Die ältere Einstellung 'notification_fields: [description, message, ric]' (Felder, je eine Zeile)
# funktioniert weiter, 'notification.template' hat aber Vorrang.

# Ausführlichkeit der Logs. Per Umgebungsvariable LOG_LEVEL änderbar.
#   INFO     eine kurze Zeile pro Ereignis (Alarm verarbeitet, Abo angelegt, Verbindung)
#   DEBUG    zusätzlich Rohdaten: Topic, QoS, kompletter Payload, passende Abos, fertige Nachricht.
#            Enthält die Alarmtexte, das Log dann nicht lange aufbewahren.
#   WARNING  nur Probleme
logging:
  level: INFO

# Derselbe Alarm kann mehrfach beim Bot ankommen: Eine Automation (z.B. in Home Assistant) kann ihn kurz nach
# dem Original noch einmal veröffentlichen, und ein Multicast mit mehreren Empfängern kommt einmal je
# Empfänger-Topic an. Der Bot erkennt das am Zeitstempel des Alarms, merkt sich für diese Zeit, an welche
# Chats er schon ging, und sendet ihn an jeden Chat nur einmal. Was bei einem Chat nicht ankam (z.B.
# Zeitüberschreitung), wird bei der nächsten Kopie noch einmal versucht. Das Gedächtnis liegt nur im
# Speicher, ein Neustart leert es. Fehlt dem Alarm der Zeitstempel, wird er nie als doppelt erkannt.
duplicates:
  remember_seconds: 300    # 0 = nicht erkennen, jede Nachricht zustellen

files:
  db_path: "data/bot_db.sqlite3"
