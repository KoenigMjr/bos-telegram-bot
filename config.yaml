# Standardkonfiguration. Ist im Image enthalten und wird bei jedem Update erneuert,
# deshalb hier nichts ändern. Eigene Anpassungen: in data/config.yaml nur die
# Einträge eintragen, die abweichen sollen (siehe README, "Konfiguration anpassen").

mqtt:
  host: "192.168.1.100"   # per Umgebungsvariable MQTT_HOST setzen
  port: 1883
  username: ""
  password: ""
  # '+' fängt jedes Fahrzeug-Subtopic ab, z.B. homeassistant/boswatch/alarm/1234567.
  # Schreibt dein Setup alles auf ein einziges Topic, hier die exakte Angabe eintragen.
  topic: "homeassistant/boswatch/alarm/+"

# Jeder Eintrag steht für ein Feld des MQTT-JSON und wird zu einem Telegram-Befehl.
#
#   for:      Name des JSON-Feldes. Daraus entsteht der Befehl (ric -> /ric).
#             Alles ist Freieingabe: /ric 1234567, /ric 123*, /message THL*
#   label:    Anzeigename in Meldungen (Standard: der Feldname)
#   match:    Verhalten bei Eingabe OHNE Wildcard
#               exact    -> der Wert muss genau passen
#               contains -> der Wert muss den Text enthalten (Standard)
#             Mit Wildcard (* % ? _) gilt immer das Muster. '301*' = beginnt mit 301,
#             '*301*' = enthält 301. 're:...' nimmt eine Regex.
#   command:  anderer Befehlsname statt dem Feldnamen (optional)
#
# Optional, wenn ein Feld einen lesbaren Namen ergänzt (z.B. RIC -> Beschreibung):
#   add:       Name des ergänzten JSON-Feldes. Daraus entsteht ein zweiter Befehl, der
#              nach Namen sucht (description -> /description). Ausgewählt wird der Name,
#              abonniert wird der Wert aus 'for'. Wildcards legen direkt ein Muster an.
#   add_label: Anzeigename dafür
#   csv:       CSV im BOSWatch3-Descriptor-Format (for,add,isRegex) mit Namen für die
#              Suche, nur lesend. Ohne Angabe wird data/descriptions_<for>.csv genutzt,
#              falls vorhanden. Per Umgebungsvariable: CSV_PATH_<FELD>, z.B. CSV_PATH_RIC.
#   learn:     Paare (for -> add) aus Alarmen merken und in die Suche aufnehmen
#              (Standard: true)
#
# Eigene Änderungen (data/config.yaml) werden über 'for' zugeordnet: gleiches 'for'
# ergänzt oder ändert diesen Eintrag, ein neues 'for' hängt einen Eintrag an,
# 'remove: true' entfernt einen Eintrag.
fields:
  - for: ric
    label: "RIC"
    match: exact
    add: description
    add_label: "Fahrzeug / Wache"

  - for: message
    label: "Alarmstichwort"

  - for: subricText
    label: "Sub-RIC"
    match: exact

# Welche Felder in der Alarm-Nachricht angezeigt werden (in dieser Reihenfolge).
notification_fields: ["description", "message", "ric"]

files:
  db_path: "data/bot_db.sqlite3"
