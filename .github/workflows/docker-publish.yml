# Baut das Docker-Image und veröffentlicht es in der GitHub Container Registry
# (ghcr.io/<owner>/<repo>). Das ist das Image, das die docker-compose.yml nutzt.
#
#   Push auf main      -> Tag :latest
#   Tag v1.2.3         -> Tags :1.2.3 und :1.2
#   Manuell (Actions)  -> baut den Stand von main neu
# Vor jedem Build laufen die Tests (python -m unittest discover -s tests -t .).
name: Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Tests zuerst: Schlägt einer fehl, wird kein Image veröffentlicht.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .

      # QEMU + Buildx: ein Image für Intel/AMD-Server UND ARM (Raspberry Pi, NAS)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Erzeugt Tags/Labels und schreibt den Image-Namen klein (Pflicht bei GHCR).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
